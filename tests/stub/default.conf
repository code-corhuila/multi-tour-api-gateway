# A stand-in for a domain service: it answers 200 and echoes what the gateway forwarded, and it
# sets headers of its own that the gateway must not repeat.
server {
    listen 8086;
    default_type application/json;
    add_header X-Correlation-Id from-the-service;
    add_header Cache-Control public;
    location / { return 200 '{"stub":"ok","xff":"$http_x_forwarded_for","correlation":"$http_x_correlation_id"}'; }
}
