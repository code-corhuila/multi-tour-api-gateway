# A stand-in for a domain service: it answers 200 and echoes what the gateway forwarded, and it
# sets headers of its own that the gateway must not repeat.
server {
    listen 8083;
    listen 8084;
    listen 8085;
    listen 8086;
    listen 8080;
    default_type application/json;
    add_header X-Correlation-Id from-the-service;
    add_header Cache-Control public;
    # as the front does: the manifest and the portal modules are never cached
    location = /federation.manifest.json { add_header Cache-Control no-cache; return 200 '{"port":"$server_port"}'; }
    location /portals/ { add_header Cache-Control no-cache; add_header Access-Control-Allow-Origin '*'; return 200 '{"port":"$server_port"}'; }
    location / { return 200 '{"stub":"ok","port":"$server_port","xff":"$http_x_forwarded_for","correlation":"$http_x_correlation_id"}'; }
}
