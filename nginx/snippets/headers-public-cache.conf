# The headers of snippets/headers.conf WITHOUT Cache-Control, for the one route whose service decides the cache
# (the public promotional image, ADR-005 E6). Keep both files in step: nginx drops the add_header of an outer
# level as soon as a location declares its own.
add_header X-Correlation-Id $correlation_id always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Expose-Headers "X-Correlation-Id, Location" always;
add_header Vary Origin always;
