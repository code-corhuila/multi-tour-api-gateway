# Rate zones of ADR-004 D10: 50 requests per second per client in general, and the stricter 60 per
# minute for the credential routes (sign-in, registration, recovery).
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=credentials:10m rate=60r/m;
limit_req_status 429;

# Reuse the X-Correlation-Id of the client only when it is short and made of safe characters, so a
# caller cannot inject anything into the logs; otherwise create one. It goes to the service, back to
# the client and into every log line.
map $http_x_correlation_id $correlation_id {
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_correlation_id;
    default                    $request_id;
}

# The cheap credential filter: a protected route with no Authorization header is rejected here. This
# is NOT token validation: every service validates the token itself (norm §5.6.2).
map $http_authorization $missing_auth {
    default 0;
    ""      1;
}
