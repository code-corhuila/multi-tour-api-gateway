# Resolve service names on EVERY request through Docker's embedded DNS, not once at start-up. With a
# static `upstream`, one domain that is down when the gateway starts takes the whole entry point
# down. Resolving per request isolates it: that route answers 503, the rest keep working (norm §5.6.3).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;
