server {
    listen 8080;

    include /etc/nginx/snippets/headers.conf;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Correlation-Id $correlation_id;
    # This is the edge: the address of the client is the one the gateway saw, never one the client sent
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    # add_header appends, so a header a service also sets would reach the client twice. Only the
    # gateway answers CORS and sets these.
    proxy_hide_header X-Correlation-Id;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    # CORS preflight, for every path; the grant itself comes from snippets/headers.conf
    if ($request_method = OPTIONS) { return 204; }

    # Errors the gateway produces itself use the common envelope, like any service. A service's own
    # errors pass untouched. Only a failure to reach a service becomes 503 (502 and 504).
    error_page 413 @too_large;
    error_page 429 @too_many_requests;
    error_page 502 504 =503 @unavailable;

    # /internal/ is never routed from outside (ADR-004 D5). A regex location wins over the prefixes of
    # routes/, so no route may use `^~` or `=` on a path that holds /internal/. Case and `;` path
    # parameters are covered because a service may ignore them when it routes.
    location ~* "^/api/v1/.+/internal([/;]|$)" {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }

    include /etc/nginx/routes/*.conf;

    location / {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"no such route","traceId":"$correlation_id"}';
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":"PAYLOAD_TOO_LARGE","message":"the body is above the limit","traceId":"$correlation_id"}';
    }

    location @too_many_requests {
        include /etc/nginx/snippets/headers.conf;
        add_header Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"slow down and retry","traceId":"$correlation_id"}';
    }

    # The credential routes ask for a longer wait: their zone allows 60 requests per minute
    location @too_many_credentials {
        include /etc/nginx/snippets/headers.conf;
        add_header Retry-After 60 always;
        default_type application/json;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"too many attempts, wait and retry","traceId":"$correlation_id"}';
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"the service is not available, retry later","traceId":"$correlation_id"}';
    }
}
