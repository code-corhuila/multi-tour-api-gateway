# Routes of multi-tour-identity-audit-api (port 8082). A service that is down answers 503 through the per-request
# resolver, so this file can exist before its service does. The target is set in a variable to force
# that resolution (Annex F).
# Public routes pass without a credential (ADR-004 D5)
location /api/v1/identity-audit/public/ {
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-identity-audit-api:8082;
    proxy_pass $target;
}

location /api/v1/identity-audit/ {
    include /etc/nginx/snippets/require-credential.conf;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-identity-audit-api:8082;
    proxy_pass $target;
}

# The logo and the commercial images of a tenant (HU-IDA-005, api spec 012): the two routes that receive a file take up to 2 MB, because a
# file of 1 MB written in base64 is about 1.4 MB of JSON and the server accepts 1 MB; the service itself refuses above 1.5 MB. The paths are
# exact: the segments exclude `/` and `;`, so no look-alike path gets the larger limit. A regex location wins over the prefixes above, so it
# repeats the credential filter and the rate limit; it declares no add_header, so the headers of the server level apply.
location ~ "^/api/v1/identity-audit/tenant/(logo|images/[0-9]{1,9})$" {
    include /etc/nginx/snippets/require-credential.conf;
    client_max_body_size 2m;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-identity-audit-api:8082;
    proxy_pass $target;
}

# The files of a tenant are shown before sign-in and must be cacheable, never no-store (api spec 012, RN-IDA-API-125): the service's
# Cache-Control passes. It is the exception, with the profile above it; a regex location wins over the prefixes, and the segments exclude `/`
# and `;` so no look-alike path matches. A hide list declared here replaces the server one, so it is repeated without Cache-Control.
location ~ "^/api/v1/identity-audit/public/tenants/[^/;]+/(logo|images/[^/;]+)$" {
    include /etc/nginx/snippets/headers-public-cache.conf;
    proxy_hide_header X-Correlation-Id;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-identity-audit-api:8082;
    proxy_pass $target;
}
