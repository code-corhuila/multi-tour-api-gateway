# Module and style of the commercial-reservation portal, served by its own container (Annex H). Its image
# serves them as /commercial-reservation-portal.{js,css} on port 80. The front mounts it from
# /portals/commercial-reservation-portal.js; no credential is asked because the shell loads before sign-in.
# A portal that is down answers 503, so only its area shows "service unavailable".
location ~ ^/portals/commercial-reservation-portal\.(js|css)$ {
    set $target http://commercial-reservation-portal:80;
    proxy_pass $target;
}
