# Module and style of the identity-audit portal, served by its own container (Annex H). The front mounts it from
# /portals/identity-audit-portal.js; nothing here asks for a credential because the shell loads before sign-in.
# A portal that is down answers 503 through the per-request resolver and error_page 502 504 =503, so only
# its area shows "service unavailable" while the other portals and the APIs keep working (norm 5.6.3).
location ~ ^/portals/identity-audit-portal\.(js|css)$ {
    set $target http://multi-tour-identity-audit-portal:8080;
    rewrite ^/portals/identity-audit-portal\.(js|css)$ /portal.$1 break;
    proxy_pass $target;
    # the portal decides what is cached; the entry is never stored
    add_header X-Correlation-Id $correlation_id always;
}
