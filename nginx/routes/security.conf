# Routes of multi-tour-security (port 8086). A service that is down answers 503 through the per-request
# resolver, so this file can exist before its service does. The target is set in a variable to force
# that resolution (Annex F).
# Sign-in, registration and recovery live here and take the stricter zone (ADR-004 D10). A location
# that defines its own error_page drops the ones of the server, so they are repeated.
location /api/v1/security/public/ {
    error_page 413 @too_large;
    error_page 429 @too_many_credentials;
    error_page 502 504 =503 @unavailable;
    limit_req zone=credentials burst=20 nodelay;
    set $target http://multi-tour-security:8086;
    proxy_pass $target;
}

location /api/v1/security/ {
    include /etc/nginx/snippets/require-credential.conf;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-security:8086;
    proxy_pass $target;
}
