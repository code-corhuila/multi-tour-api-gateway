# Routes of multi-tour-commercial-reservation-api (port 8083). A service that is down answers 503 through the per-request
# resolver, so this file can exist before its service does. The target is set in a variable to force
# that resolution (Annex F).
# Public routes pass without a credential (ADR-004 D5)
location /api/v1/commercial-reservation/public/ {
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-commercial-reservation-api:8083;
    proxy_pass $target;
}

location /api/v1/commercial-reservation/ {
    include /etc/nginx/snippets/require-credential.conf;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-commercial-reservation-api:8083;
    proxy_pass $target;
}

# The upload of the proof of a payment is the only route that takes a body above 1 MB: 6 MB, with 413 above it
# (ADR-004 D10, ADR-005 E6; commercial-reservation.yaml). The path is exact: the segments exclude `/` and `;`, so
# no look-alike path gets the larger limit. A regex location wins over the prefixes above, so it repeats the
# credential filter and the rate limit; it declares no add_header, so the headers of the server level apply.
location ~ "^/api/v1/commercial-reservation/reservations/[^/;]+/payments$" {
    include /etc/nginx/snippets/require-credential.conf;
    client_max_body_size 6m;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-commercial-reservation-api:8083;
    proxy_pass $target;
}
