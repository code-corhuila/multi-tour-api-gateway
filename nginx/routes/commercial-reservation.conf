# Routes of multi-tour-commercial-reservation-api (port 8083). A service that is down answers 503 through the per-request
# resolver, so this file can exist before its service does. The target is set in a variable to force
# that resolution (Annex F).
# Public routes pass without a credential (ADR-004 D5)
location /api/v1/commercial-reservation/public/ {
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-commercial-reservation-api:8083;
    proxy_pass $target;
}

location /api/v1/commercial-reservation/ {
    include /etc/nginx/snippets/require-credential.conf;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-commercial-reservation-api:8083;
    proxy_pass $target;
}

# The promotional image of an association is shown before sign-in and must be cacheable, never no-store
# (ADR-005 E6; commercial-reservation.yaml). It is the only exception: the service's Cache-Control passes. A
# regex location wins over the prefixes above; the segments exclude `/` and `;` so no look-alike path matches.
# A hide list declared here replaces the server one, so it is repeated without Cache-Control.
location ~ "^/api/v1/commercial-reservation/public/tenants/[^/;]+/associated-establishments/[^/;]+/image$" {
    include /etc/nginx/snippets/headers-public-cache.conf;
    proxy_hide_header X-Correlation-Id;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-commercial-reservation-api:8083;
    proxy_pass $target;
}
