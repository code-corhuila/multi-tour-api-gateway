# Routes of multi-tour-commercial-reservation-api (port 8083). A service that is down answers 503 through the per-request
# resolver, so this file can exist before its service does. The target is set in a variable to force
# that resolution (Annex F).
# Public routes pass without a credential (ADR-004 D5)
location /api/v1/commercial-reservation/public/ {
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-commercial-reservation-api:8083;
    proxy_pass $target;
}

location /api/v1/commercial-reservation/ {
    include /etc/nginx/snippets/require-credential.conf;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-commercial-reservation-api:8083;
    proxy_pass $target;
}
