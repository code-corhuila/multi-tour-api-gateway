# Module and style of the cash-reporting portal, served by its own container (Annex H). Its image serves them as
# /cash-reporting-portal.{js,css} on port 80. The front mounts it from /portals/cash-reporting-portal.js; no credential
# is asked because the shell loads before sign-in. A portal that is down answers 503, so only its area shows
# "service unavailable".
location ~ ^/portals/cash-reporting-portal\.(js|css)$ {
    set $target http://cash-reporting-portal:80;
    # the container serves the file as /<portal>.{js,css}, without the /portals/ prefix
    rewrite ^/portals/(.*)$ /$1 break;
    proxy_pass $target;
}
