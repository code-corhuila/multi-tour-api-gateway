# Routes of multi-tour-operations-cost-api (port 8084). A service that is down answers 503 through the per-request
# resolver, so this file can exist before its service does. The target is set in a variable to force
# that resolution (Annex F).
# Public routes pass without a credential (ADR-004 D5)
location /api/v1/operations-cost/public/ {
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-operations-cost-api:8084;
    proxy_pass $target;
}

location /api/v1/operations-cost/ {
    include /etc/nginx/snippets/require-credential.conf;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-operations-cost-api:8084;
    proxy_pass $target;
}
