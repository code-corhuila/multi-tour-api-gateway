# One location per saga: each is its own repository (ADR-004 D3). It serves `POST /api/v1/sagas/<saga>` and
# `GET /api/v1/sagas/<saga>/{id}`. Like a domain route it only filters the credential; the workflow
# validates the token. A saga calls several services in a row, so it may take longer than the others.
location /api/v1/sagas/onboard-tenant {
    include /etc/nginx/snippets/require-credential.conf;
    limit_req zone=general burst=100 nodelay;
    set $target http://multi-tour-workflow-onboard-tenant:8090;
    proxy_pass $target;
    proxy_read_timeout 60s;
}

