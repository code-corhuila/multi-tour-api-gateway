worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # One JSON object per request, with the correlation id (ADR-004 D8).
    log_format json escape=json '{"time":"$time_iso8601","correlationId":"$correlation_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"upstream":"$upstream_addr","durationMs":$request_time}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    server_tokens off;

    # Limits of ADR-004 D10; the proof-upload route raises the body limit in its own location.
    client_max_body_size 1m;
    client_header_timeout 5s;
    client_body_timeout 10s;
    keepalive_timeout 60s;

    include /etc/nginx/conf.d/*.conf;
}
